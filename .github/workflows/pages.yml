name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - name: Stage the public site
        run: |
          mkdir -p _site/app
          cp site/index.html site/styles.css site/.nojekyll site/probe.html _site/
          cp -r site/assets _site/
          cp -r site/editor _site/
          # The app is the same bundle the firmware serves, published so it has
          # a trusted HTTPS origin - which is what unlocks Keyboard Lock.
          # web.zip is an upload for the device, and recover.html is the
          # firmware-only repair page.
          cp main/web/dist/* _site/app/
          rm -f _site/app/web.zip _site/app/recover.html
          # Tell the app it is the published copy. The firmware's shell has no
          # marker, which is how the same bundle shows a device list here and a
          # code prompt there.
          sed -i 's#</head>#<meta name="keebling-published" content="1"></head>#' _site/app/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
