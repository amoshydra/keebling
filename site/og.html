<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keebling — social card</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0d0e11; }
  .og {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0d0e11;
  }
  .og::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(42% 55% at 78% 46%, rgba(242,169,59,.14), transparent 72%),
      linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
    background-size: auto, 44px 44px, 44px 44px;
  }
  .og-art {
    position: absolute;
    right: 0;
    top: 0;
    width: 640px;
    height: 630px;
    object-fit: cover;
    object-position: 58% center;
    mask-image: linear-gradient(90deg, transparent 0%, #000 20%);
  }
  .og::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(13,14,17,.98) 0%, rgba(13,14,17,.9) 36%, rgba(13,14,17,.18) 66%, rgba(13,14,17,.3) 100%);
    pointer-events: none;
  }
  .og .content { position: absolute; z-index: 2; left: 62px; bottom: 58px; max-width: 580px; }
  .og .brand { display: flex; align-items: center; gap: 16px; font-size: 64px; font-weight: 900; letter-spacing: -.055em; line-height: 1; }
  .og .brand svg { width: 64px; height: 64px; }
  .og .tag { margin: 16px 0 0; font-family: var(--mono); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--amber); }
  .og .line { margin: 14px 0 0; max-width: 560px; font-size: 20px; line-height: 1.45; color: #d4ccbd; }
  .og .url { position: absolute; right: 62px; bottom: 34px; z-index: 2; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="mark" viewBox="0 0 128 128">
      <rect x="4" y="52" width="26" height="28" rx="3" fill="#c9c4ba"/>
      <rect x="26" y="52" width="4" height="28" fill="#9a958c"/>
      <rect x="11" y="59" width="6" height="6" rx="1" fill="#6b6660"/>
      <rect x="11" y="68" width="6" height="6" rx="1" fill="#6b6660"/>
      <rect x="24" y="42" width="96" height="48" rx="18" fill="#d8ebe4"/>
      <rect x="30" y="48" width="84" height="36" rx="12" fill="#5a9a6a"/>
      <rect x="40" y="53" width="64" height="26" rx="7" fill="#0e1211"/>
      <circle cx="64" cy="38" r="12" fill="#f4f7f2" stroke="#cfd8d2" stroke-width="1.5"/>
      <circle cx="86" cy="36" r="11" fill="#f4f7f2" stroke="#cfd8d2" stroke-width="1.5"/>
      <circle cx="68" cy="41" r="4.5" fill="#1b1a17"/>
      <circle cx="83" cy="33" r="4.2" fill="#1b1a17"/>
      <circle cx="66.5" cy="39" r="1.3" fill="#fff"/>
      <circle cx="81.5" cy="31" r="1.2" fill="#fff"/>
      <rect x="98" y="79" width="10" height="5" rx="2" fill="#e8d5b5"/>
    </symbol>
  </svg>
  <div class="og">
    <img class="og-art" src="assets/hero-cozy.webp" alt="">
    <div class="content">
      <div class="brand">
        <svg viewBox="0 0 128 128" aria-hidden="true"><use href="#mark"/></svg>
        keebling
      </div>
      <p class="tag">a baby keyboard</p>
      <p class="line">A dongle with two googly eyes and a keyboard inside. It types into anything, and never asks the host for permission.</p>
    </div>
    <div class="url">keebling.dev</div>
  </div>
</body>
</html>
