<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20128%20128%22%3E%20%3Crect%20x%3D%224%22%20y%3D%2252%22%20width%3D%2226%22%20height%3D%2228%22%20rx%3D%223%22%20fill%3D%22%23c9c4ba%22%2F%3E%20%3Crect%20x%3D%2226%22%20y%3D%2252%22%20width%3D%224%22%20height%3D%2228%22%20fill%3D%22%239a958c%22%2F%3E%20%3Crect%20x%3D%2211%22%20y%3D%2259%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221%22%20fill%3D%22%236b6660%22%2F%3E%20%3Crect%20x%3D%2211%22%20y%3D%2268%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221%22%20fill%3D%22%236b6660%22%2F%3E%20%3Crect%20x%3D%2224%22%20y%3D%2242%22%20width%3D%2296%22%20height%3D%2248%22%20rx%3D%2218%22%20fill%3D%22%23d8ebe4%22%2F%3E%20%3Crect%20x%3D%2230%22%20y%3D%2248%22%20width%3D%2284%22%20height%3D%2236%22%20rx%3D%2212%22%20fill%3D%22%235a9a6a%22%2F%3E%20%3Crect%20x%3D%2240%22%20y%3D%2253%22%20width%3D%2264%22%20height%3D%2226%22%20rx%3D%227%22%20fill%3D%22%230e1211%22%2F%3E%20%3Ccircle%20cx%3D%2264%22%20cy%3D%2238%22%20r%3D%2212%22%20fill%3D%22%23f4f7f2%22%20stroke%3D%22%23cfd8d2%22%20stroke-width%3D%221.5%22%2F%3E%20%3Ccircle%20cx%3D%2286%22%20cy%3D%2236%22%20r%3D%2211%22%20fill%3D%22%23f4f7f2%22%20stroke%3D%22%23cfd8d2%22%20stroke-width%3D%221.5%22%2F%3E%20%3Ccircle%20cx%3D%2268%22%20cy%3D%2241%22%20r%3D%224.5%22%20fill%3D%22%231b1a17%22%2F%3E%20%3Ccircle%20cx%3D%2283%22%20cy%3D%2233%22%20r%3D%224.2%22%20fill%3D%22%231b1a17%22%2F%3E%20%3Ccircle%20cx%3D%2266.5%22%20cy%3D%2239%22%20r%3D%221.3%22%20fill%3D%22%23fff%22%2F%3E%20%3Ccircle%20cx%3D%2281.5%22%20cy%3D%2231%22%20r%3D%221.2%22%20fill%3D%22%23fff%22%2F%3E%20%3Crect%20x%3D%2298%22%20y%3D%2279%22%20width%3D%2210%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e8d5b5%22%2F%3E%20%3C%2Fsvg%3E" type="image/svg+xml">
<meta name="theme-color" content="#111">
<meta name="apple-mobile-web-app-title" content="Keebling">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Keebling</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- One shell for every view. The top bar and the status dot live here, so a
     view script always reports into the same elements; the views themselves
     are <template>s below and the router mounts exactly one at a time. -->
<div class="topbar">
  <span><span class="dot off" id="dot"></span><span id="statusText">connecting…</span></span>
  <!-- Always reachable, never adjacent to a button you press in a hurry. It is
       the one action you look for when something is stuck on the host. -->
  <button id="bRelease" class="releasechip" type="button">Release</button>
</div>

<!-- One access gate for the whole shell. It stays hidden until requireAuth
     finds no valid saved code; the markup lives here so it is parsed once. -->
<div id="gate" class="hidden">
  <div class="gate-box">
    <svg class="gate-mark" viewBox="0 0 128 128" aria-hidden="true">
      <rect x="4" y="52" width="26" height="28" rx="3" fill="#c9c4ba"/>
      <rect x="26" y="52" width="4" height="28" fill="#9a958c"/>
      <rect x="11" y="59" width="6" height="6" rx="1" fill="#6b6660"/>
      <rect x="11" y="68" width="6" height="6" rx="1" fill="#6b6660"/>
      <rect x="24" y="42" width="96" height="48" rx="18" fill="#d8ebe4"/>
      <rect x="30" y="48" width="84" height="36" rx="12" fill="#5a9a6a"/>
      <rect x="40" y="53" width="64" height="26" rx="7" fill="#0e1211"/>
      <circle cx="64" cy="38" r="12" fill="#f4f7f2" stroke="#cfd8d2" stroke-width="1.5"/>
      <circle cx="86" cy="36" r="11" fill="#f4f7f2" stroke="#cfd8d2" stroke-width="1.5"/>
      <circle cx="68" cy="41" r="4.5" fill="#1b1a17"/>
      <circle cx="83" cy="33" r="4.2" fill="#1b1a17"/>
      <circle cx="66.5" cy="39" r="1.3" fill="#fff"/>
      <circle cx="81.5" cy="31" r="1.2" fill="#fff"/>
      <rect x="98" y="79" width="10" height="5" rx="2" fill="#e8d5b5"/>
    </svg>
    <h1>Keebling</h1>
    <p>Enter the 12-character code shown on the device's LCD &mdash; or scan its QR.</p>
    <input id="tokenInput" type="text" inputmode="latin" autocomplete="off"
           autocapitalize="characters" spellcheck="false" maxlength="20"
           placeholder="XXXXXXXXXXXX">
    <button id="tokenGo" class="primary">Connect</button>
    <p class="err" id="gateErr"></p>
  </div>
</div>

<!-- The router clones one template here. Templates are inert, so their IDs do
     not exist until they are mounted - which is what keeps the four views'
     colliding IDs (dot, statusText, ...) out of each other's way. -->
<main id="view"></main>

<!-- The four destinations. Bottom tabs rather than links in the status bar:
   this is the thumb zone, and it is the shape a phone app is expected to have.
   Setup owns the pages that are not everyday: settings and the UI files. -->
<nav class="tabbar">
  <a href="#/" data-tab="remote">Remote</a>
  <a href="#/keys" data-tab="keys">Keys</a>
  <a href="#/deck" data-tab="deck">Pages</a>
  <a href="#/setup" data-tab="setup">Setup</a>
</nav>

<template id="view-control">
  <div id="pad">
    <div id="hint">
      One finger moves · two scroll · three drag<br>
      Tap to click · <span class="hint-help">?</span> button shows all gestures
    </div>
    <div id="escHint">Mouse and keyboard captured — Esc releases it</div>
    <div class="flash" id="flash"></div>
    <!-- A captured pad has no text the user is looking at, so the whole
         surface changes when the link drops: red hatch and border, not just
         the status dot in the far corner. -->
    <div id="linkLost" role="alert">
      <span class="lost-mark" aria-hidden="true">!</span>
      <span class="lost-title">Connection lost</span>
      <span class="lost-sub" id="linkLostSub">Input is not reaching the host — reconnecting…</span>
      <span class="lost-sub">Esc releases the mouse.</span>
    </div>
    <!-- Low-key confirmation that the host is receiving input. Only visible
         while captured and connected. -->
    <div id="inputPulse" aria-hidden="true"></div>
    <!-- Relative or absolute pointer. Absolute maps the pad to a position on
         the host's screen instead of moving by deltas; see docs/absolute-pointer.md
         for what each host does with that. -->
    <button id="padMode" type="button" aria-label="Pointer mode">Relative</button>
    <!-- Three buttons that need to be reachable without leaving the pad. They
         float over it at the thumb rather than sitting in a row of their own. -->
    <div id="mouseButtons">
      <button id="bLeft" type="button">L</button>
      <button id="bMid" type="button">M</button>
      <button id="bRight" type="button">R</button>
    </div>
    <button id="helpOpen" type="button" aria-label="Gesture help">?</button>
  </div>

  <!-- First-visit gesture help. Fixed above the pad, so dismissing it leaves
       the pad untouched; it is reopened by the ? button in the pad corner. -->
  <div id="help" class="help" hidden>
    <div class="help-sheet" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
      <h2 id="helpTitle">Gestures</h2>
      <ul class="help-list">
        <li>
          <span class="fingers" aria-hidden="true"><i></i></span>
          <span><strong>One finger</strong><small>Move the pointer · tap for a left click</small></span>
        </li>
        <li>
          <span class="fingers" aria-hidden="true"><i></i><i></i></span>
          <span><strong>Two fingers</strong><small>Scroll · tap for a right click</small></span>
        </li>
        <li>
          <span class="fingers" aria-hidden="true"><i></i><i></i><i></i></span>
          <span><strong>Three fingers</strong><small>Drag: press, move, release · tap for a middle click</small></span>
        </li>
        <li>
          <span class="keycap" aria-hidden="true">Ctrl</span>
          <span><strong>Chord</strong><small>Tap Ctrl, Alt or Cmd on the keyboard, then the next key</small></span>
        </li>
      </ul>
      <p class="help-note">On a computer, click the pad to capture the mouse and
        keyboard, and press Esc to release them. While captured, the small dot
        in the pad corner lights when input is going out.</p>
      <button id="helpClose" class="primary" type="button">Got it</button>
    </div>
  </div>

  <!-- The Keys destination owns every way of sending keys: the on-screen
       keyboard, the phone's own keyboard, media keys and typed text. The strip
       picks which, so they stop being sibling pages you navigate between. -->
  <div id="kbd">
    <!-- One strip: two pinned tools, then the pages. The tools are not places
         you type - picking one replaces the whole slot - so they are drawn as
         square icon buttons and the pages are drawn as words. That keeps
         navigation from looking like another row of keys, and lets the page
         row scroll under a fade when there are more pages than fit. -->
    <div id="kbStrip">
      <div class="kbtool">
        <button type="button" id="kbToolSource" aria-label="Your keyboard" aria-pressed="false"><svg data-icon="keyboard" class="ico"></svg></button>
        <button type="button" id="kbToolText" aria-label="Paste text" aria-pressed="false"><svg data-icon="clipboard" class="ico"></svg></button>
      </div>
      <div class="kbsep" aria-hidden="true"></div>
      <div id="kbPages" role="tablist" aria-label="Key pages">
        <button type="button" role="tab" class="kbpage" data-page="abc">ABC</button>
        <button type="button" role="tab" class="kbpage" data-page="sym">?123</button>
        <button type="button" role="tab" class="kbpage" data-page="fn">Fn</button>
        <button type="button" role="tab" class="kbpage" data-page="kp">Num</button>
        <button type="button" role="tab" class="kbpage" data-page="media">Media</button>
      </div>
    </div>

  <div class="panel" id="type">
    <h2>Type text into the host</h2>
    <textarea id="typeText" placeholder="Paste or type text here — it will be typed into the host as real keystrokes."
              spellcheck="false" autocapitalize="none" autocomplete="off"></textarea>
    <div class="row" style="margin:8px 0">
      <button id="typeGo" class="primary">Type it</button>
      <button id="typeStop" class="danger">Stop</button>
      <button id="typeClear">Clear</button>
    </div>
    <p class="note" id="typeNote">Assumes a US QWERTY host layout. Keep this tab in
      the foreground while typing &mdash; browsers throttle timers in background tabs.</p>
  </div>

  <!-- The keyboard slot. Picking the phone's own keyboard replaces everything
       the built-in one draws, so it is a tool in the strip rather than a second
       row: it describes the phone you are holding, not the device. The choice
       is remembered per browser. -->
    <div id="kbBuilt"></div>
    <!-- A user page drawn in the slot, when the strip names one. The same
         renderer draws it here and in the Pages tab. -->
    <div id="kbLayout" hidden></div>
    <!-- What the host says its lock keys are doing. Empty and hidden when they
         are all off, so it costs nothing in the normal case. -->
    <div id="kbLeds" hidden></div>
    <div id="kbCapture" hidden>
      <button id="kbCaptureOpen" type="button" class="primary">⌨ Tap to type</button>
      <p class="note">Keys go to the host — nothing echoes here.</p>
      <!-- The focus target: 1px at the viewport's top-left corner, invisible,
           taking no pointer events. The caret sits at the origin, above the
           keyboard and above everything else, so focusing it never scrolls
           anything into view. -->
      <input id="kbCaptureField" type="text" inputmode="text" spellcheck="false"
             autocomplete="off" autocorrect="off" autocapitalize="none"
             aria-label="Type with your keyboard">
    </div>

    <div class="panel" id="mediaPanel">
      <h2>Media &amp; browser keys</h2>
      <div id="media"></div>
      <p class="note" id="mediaNote">These are Consumer Control usages. Whether
        they do anything depends on the host — macOS and Windows handle the
        transport and volume keys; some Linux desktops need the keybound to an
        action first.</p>
    </div>
  </div>
</template>

<template id="view-settings">
  <div class="wrap wrap-setup">
    <!-- A list of sections rather than one long page: nine screens of settings
         in a column is a scroll, not a menu. One section is open at a time. -->
    <div id="setupList"></div>
    <button id="setupBack" class="setupback" type="button" hidden>‹ All settings</button>

    <section data-page="device">
      <h2>Device</h2>
      <div class="field">
        <span>Product name — the device name the host shows <small>(USB string 2)</small></span>
        <input type="text" id="usbProduct" maxlength="31" spellcheck="false"
               autocomplete="off" placeholder="Keebling">
      </div>
      <div class="field">
        <span>Manufacturer <small>(USB string 1)</small></span>
        <input type="text" id="usbManufacturer" maxlength="31" spellcheck="false"
               autocomplete="off" placeholder="amoshydra">
      </div>
      <div class="field">
        <span>Interface label <small>(USB string 4 — cosmetic)</small></span>
        <input type="text" id="usbInterface" maxlength="31" spellcheck="false"
               autocomplete="off" placeholder="Keyboard Mouse Media">
      </div>
      <p class="note">ASCII only, up to 31 characters — anything else is replaced
        with “?”. Both take effect after a restart, and the host must re-read the
        USB descriptors (replug the dongle).</p>
      <div class="row">
        <button id="restart">Restart device</button>
      </div>
    </section>

    <section data-page="screen">
      <h2>Screen</h2>
      <div class="field">
        <span>Custom text <small>(the third BOOT screen)</small></span>
        <textarea id="screenText" rows="4" maxlength="260" spellcheck="false"
                  placeholder="Line one&#10;line two"></textarea>
        <p class="note">Shown on the LCD as 10 lines of 26 characters, so one
          screen holds 260. Enter starts a new line; longer lines wrap at a
          space, and a word with no space in it is cut. Plain ASCII only — the
          font has 96 glyphs, so anything else shows as “?” (one per byte: an em
          dash is three). Anything past the tenth line is dropped and marked
          with “...”. Leave it empty and the screen stays out of the BOOT cycle.</p>
      </div>
      <div class="field">
        <span>Custom image <small>(the fourth BOOT screen)</small></span>
        <div class="row" style="margin-bottom:8px">
          <label><input type="radio" name="screenImageFormat" value="colour" checked> Colour</label>
          <label><input type="radio" name="screenImageFormat" value="grey"> Greyscale</label>
        </div>
        <div class="row" style="margin-bottom:8px">
          <button id="screenImagePick">Choose image…</button>
          <button id="screenImageSend" class="primary" disabled>Send to device</button>
          <button id="screenImageClear" hidden>Remove from device</button>
          <input type="file" id="screenImageFile" accept="image/*" hidden>
        </div>
        <canvas id="screenImagePreview" width="160" height="80"
                style="width:100%;max-width:320px;display:block;background:#000;
                       border:1px solid var(--line);border-radius:6px;
                       image-rendering:pixelated"></canvas>
        <p class="note" id="screenImageNote">checking the device…</p>
        <p class="note" id="screenImageHint">The preview above is the browser's
          rendering of the packed file — the dithered 160×80 copy the device will
          draw, not your original image. A colour image is packed as RGB565 at
          25,608 bytes; greyscale is 16 levels at 6,408, so a logo or a text card
          does not need four times the file. The panel is an uncalibrated TN run
          inverted, so colour will look muted and shift with the viewing angle;
          no gamma correction is attempted because the panel's response is
          unknown. An image of a different shape is scaled to fill the panel and
          cropped. With no image stored, this screen stays out of the BOOT cycle.</p>
      </div>
      <div class="field">
        <label>Sleep after <input type="range" id="screenTimeout" min="0" max="120" step="5">
          <span id="screenTimeoutVal"></span></label>
        <p class="note">Seconds without a button press before the display blanks.
          Set to 0 to leave it on. A tap of BOOT wakes it; a further tap cycles
          between the pairing QR, the status screen and the custom text.</p>
      </div>
    </section>

    <section data-page="pointer">
      <h2>Touchpad</h2>
      <div class="field">
        <label>Pointer gain <input type="range" id="mouseGain" min="-200" max="90" step="1">
          <span id="mouseGainVal"></span></label>
        <span class="note">A high-DPI mouse reports raw counts while captured, and the OS
          pointer-speed curve does not apply — so a 3200 DPI gaming mouse needs
          roughly <code>0.02</code> here, where a basic mouse needs about
          <code>1</code>.</span>
      </div>
      <div class="field">
        <label>Scroll speed <input type="range" id="scrollScale" min="-70" max="90" step="1">
          <span id="scrollScaleVal"></span></label>
      </div>
      <div class="field">
        <label><input type="checkbox" id="scrollInvert"> Invert scroll direction</label>
      </div>
      <div class="field">
        <label><input type="checkbox" id="tapClick"> Tap to click</label>
      </div>
      <div class="field">
        <label>Tap timeout <input type="range" id="tapMaxMs" min="80" max="500" step="10">
          <span id="tapMaxMsVal"></span></label>
      </div>
      <p class="note">Gestures: one finger moves and taps to click · two fingers
        scroll and tap to right-click · three fingers drag (press, move, release).</p>
    </section>

    <section data-page="typing">
      <h2>Typing</h2>
      <div class="field">
        <span>Host keyboard layout</span>
        <select id="hostLayout">
          <option value="us">US QWERTY</option>
          <option value="uk">UK QWERTY</option>
        </select>
        <p class="note">What <strong>the host</strong> is set to. The on-screen
          keys and typed text are positions on this layout, so they only produce
          the characters shown if the host agrees. A UK board differs from a US
          one in its punctuation, not its letters.</p>
      </div>
      <div class="field">
        <label>Speed <input type="range" id="typeSpeed" min="2" max="60" step="1">
          <span id="typeSpeedVal"></span></label>
        <p class="note">Lower this if the target drops characters.</p>
      </div>
    </section>

    <section data-page="network">
      <h2>Network</h2>
      <div class="field">
        <span>Current</span>
        <div class="note" id="netState">unknown</div>
      </div>
      <div class="field">
        <span>Saved networks <small>(tried in this order)</small></span>
        <div class="list wifilist" id="wifiSaved"></div>
      </div>
      <div class="row">
        <button id="wifiScan">Scan networks</button>
      </div>
      <div class="list" id="wifiList"></div>
      <div class="field">
        <span>Add a network</span>
        <input type="text" id="wifiSsid" placeholder="Network name (SSID)"
               autocomplete="off" spellcheck="false" autocapitalize="none">
      </div>
      <div class="field">
        <span>Password</span>
        <input type="password" id="wifiPass" placeholder="Password" autocomplete="off">
      </div>
      <div class="field">
        <label><input type="checkbox" id="wifiHidden"> Hidden network</label>
      </div>
      <div class="row">
        <button id="wifiSave" class="primary">Add network</button>
      </div>
      <p class="note" id="wifiNote">Passwords are stored on the device.
        Reordering is used the next time it connects.</p>
    </section>

    <section data-page="hid">
      <h2>HID descriptor</h2>
      <p class="note">Exactly what the device reports to the operating system:
        the report descriptor it hands over at enumeration, plus the interface
        parameters from the configuration descriptor.</p>
      <div class="row" style="margin:10px 0">
        <button id="hidLoad">Show what the host sees</button>
      </div>
      <div class="note" id="hidSummary">not loaded</div>
      <pre id="hidDecoded" style="font-size:11px;line-height:1.45;color:#bbb;
           white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,monospace;margin-top:10px"></pre>
      <details style="margin-top:10px">
        <summary class="note" style="cursor:pointer">Raw descriptor bytes</summary>
        <pre id="hidRaw" style="font-size:11px;line-height:1.5;color:#999;white-space:pre-wrap;
             word-break:break-all;font-family:ui-monospace,SFMono-Regular,monospace"></pre>
      </details>
    </section>

    <section data-page="backup">
      <h2>Backup</h2>
      <p class="note">Everything you would otherwise have to re-enter: the device
        settings and the macros stored in <strong>this browser</strong>. It does
        not include your WiFi password, which lives in a separate store, so after
        a restore you may need to rejoin the network.</p>
      <div class="row" style="margin:10px 0">
        <button id="backupSave" class="primary">Download backup</button>
        <button id="backupLoad">Restore from file</button>
        <input type="file" id="backupFile" accept="application/json,.json" hidden>
      </div>
      <p class="note" id="backupNote"></p>
    </section>

    <section data-page="ui">
      <h2>Web UI files</h2>
      <p class="note">The pages are built into the firmware, but files uploaded to
        the device's filesystem are served instead. Open the UI files page to
        upload one or reset it to the built-in copy. This button deletes every
        uploaded file at once — the way back if an uploaded view script is broken.</p>
      <div class="row" style="margin:10px 0">
        <button id="uiOpen">Open UI files page</button>
        <button id="uiResetAll" class="danger">Reset UI to built-in</button>
      </div>
      <p class="note" id="uiNote"></p>
    </section>

    <section data-page="diagnostics">
      <h2>Diagnostics</h2>
      <div class="row" style="margin-bottom:10px">
        <button id="logsLoad">Load logs</button>
        <button id="forgetCode">Forget saved code</button>
      </div>
      <div class="panel" id="logs" style="max-height:40dvh"><pre id="logText">—</pre></div>
    </section>

    <!-- Temporary instrument. It exists to answer one question: what does the
         browser actually deliver from the phone's own keyboard? That decides
         whether a system keyboard (Hacker's Keyboard, an IME, a Bluetooth
         board) can drive the device directly, or whether it has to be
         translated through a capture field first. Remove it once the answer is
         recorded in the design notes. -->
    <section data-page="diagnostics">
      <h2>Key event probe</h2>
      <p class="note">Records exactly what the browser delivers from a keyboard
        &mdash; the phone&rsquo;s own keyboard, a Bluetooth board, or this
        computer. Tap the box below, then press keys on whichever keyboard you
        want to test.</p>
      <p class="note">Try each one, because they can take different paths:
        a letter, <strong>Shift</strong>+a letter, <strong>Ctrl</strong>+C,
        Tab, Esc, F5, the four arrows, Backspace with text in the box and
        without, Enter, and a chord your keyboard can make.</p>
      <textarea id="probeField" rows="2" spellcheck="false"
                autocorrect="off" autocapitalize="none" autocomplete="off"
                placeholder="tap here, then press keys"></textarea>
      <div class="row" style="margin:10px 0">
        <button id="probeClear">Clear</button>
        <button id="probeSelect">Select all</button>
      </div>
      <div class="note" id="probeStats">not listening</div>
      <pre id="probeLog"></pre>
      <p class="note">No copy button: this page is served over plain HTTP, where
        the clipboard API is unavailable. Select all, then copy from the
        selection menu.</p>
    </section>

    <div class="savebar">
      <button id="save" class="primary">Save now</button>
      <span class="note" id="saveNote" style="margin:0">changes save automatically</span>
    </div>

  </div>
</template>

<template id="view-macros">
  <div class="wrap wrap-macros">

    <section>
      <h2>Pages</h2>
      <p class="note">A page is rows of keys. A key can hold a HID key, latch a
        modifier, run a script, or jump to another page. Scripts use braced tokens
        for keys that are not characters:
        <code>{SEARCH}chrome{ENTER}</code> presses the Search media key, types
        “chrome” and presses Enter. Text assumes a US QWERTY layout on the host.</p>
      <p class="note">Pages are stored in <strong>this browser</strong>, not on
        the device. They are not shared with another phone or browser, and
        clearing this site's data removes them.</p>
      <div id="deckPages" class="pagestrip" role="tablist" aria-label="Pages"></div>
      <div id="deckPageTools" class="pagerow" hidden></div>
      <div id="macroList"></div>
      <div class="row" style="margin-top:12px">
        <button id="macroAdd" class="primary">New key</button>
        <button id="deckEdit">Edit</button>
      </div>
      <p class="note" id="saveNote"></p>
      <p class="note" id="blobMeter"></p>
    </section>

    <section id="pageImport">
      <h2>Import a page</h2>
      <p class="note">Paste the JSON the editor exports, or open the file. The
        pages are added beside the ones you already have; an id or a name that
        already exists is suffixed rather than overwritten.</p>
      <textarea id="importText" rows="5" spellcheck="false" autocapitalize="none"
                autocomplete="off" placeholder='{ "app": "keebling", "kind": "layout", "pages": [ … ] }'></textarea>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
      <div class="row" style="margin-top:8px">
        <button id="importGo" class="primary">Import from the box</button>
        <button id="importPick">Open a file…</button>
      </div>
      <p class="note" id="importNote"></p>
    </section>

    <section id="pageEditor">
      <h2>Editor</h2>
      <p class="note">The same editor as
        <a href="https://amoshydra.github.io/keebling/editor/" target="_blank" rel="noopener">the hosted one</a>,
        built from the same source. Edit a page, then press <strong>Use in Pages</strong>.</p>
      <iframe id="editorFrame" title="Keebling layout editor" loading="lazy"
              src="editor.html" sandbox="allow-scripts allow-downloads"></iframe>
    </section>

    <section id="editor">
      <h2 id="editorTitle">New macro</h2>
      <div class="field">
        <span>Name</span>
        <input type="text" id="editName" maxlength="40" spellcheck="false"
               autocomplete="off" autocapitalize="none" placeholder="Open Chrome">
      </div>
      <div class="field">
        <span>Type</span>
        <div id="editKind" class="segmented" role="group" aria-label="Button type">
          <button type="button" data-kind="script" class="on">Script</button>
          <button type="button" data-kind="key">Hold a key</button>
          <button type="button" data-kind="modifier">Modifier</button>
          <button type="button" data-kind="page">Go to page</button>
        </div>
      </div>
      <div class="field">
        <span>Colour</span>
        <div id="editColours" class="swatches" role="group" aria-label="Button colour">
          <button type="button" data-colour="grey" aria-label="Grey"></button>
          <button type="button" data-colour="blue" aria-label="Blue"></button>
          <button type="button" data-colour="amber" aria-label="Amber"></button>
          <button type="button" data-colour="red" aria-label="Red"></button>
          <button type="button" data-colour="green" aria-label="Green"></button>
        </div>
      </div>
      <div class="field" id="editHoldField">
        <label style="font-size:13px;display:flex;gap:10px;align-items:center">
          <input type="checkbox" id="editHold">
          <span>Run while held, stop on release</span>
        </label>
      </div>
      <div class="field" id="editKeyField" hidden>
        <span>Key</span>
        <select id="editKey"></select>
        <p class="note">The key stays down while your finger is, so the host
          repeats it — the difference between an arrow key and a macro that
          presses it once.</p>
      </div>
      <div class="field" id="editModifierField" hidden>
        <span>Modifier</span>
        <select id="editModifier"></select>
        <p class="note">Tapping it latches the modifier for the next key, so a
          capital or Ctrl+C needs one finger.</p>
      </div>
      <div class="field" id="editPageField" hidden>
        <span>Page</span>
        <select id="editPageTarget"></select>
        <p class="note">A jump to a page that is deleted later is refused at
          delete time, not discovered in the dark.</p>
      </div>
      <div class="field" id="editStepsField">
        <span>Steps</span>
        <textarea id="editSteps" rows="3" spellcheck="false" autocapitalize="none"
                  autocomplete="off" placeholder="{SEARCH}chrome{ENTER}"></textarea>
      </div>
      <details id="editInsert">
        <summary class="note" style="cursor:pointer">Insert a token</summary>
        <div class="chips" id="chips"></div>
      </details>
      <div class="note" id="parsePreview" style="margin-top:10px"></div>
      <div class="row" style="margin-top:12px">
        <button id="editSave" class="primary">Save button</button>
        <button id="editCancel">Cancel</button>
      </div>
    </section>

    <section>
      <h2>Grammar</h2>
      <p class="note">Anything outside braces is typed as literal text. A literal
        brace is written <code>{{</code> or <code>}}</code>. Tokens are not case
        sensitive.</p>
      <div class="tokens" style="margin-top:12px">
        <span>Keys</span>
        <code>{ENTER} {TAB} {ESC} {BKSP} {DEL} {INS} {UP} {DOWN} {LEFT} {RIGHT}
          {HOME} {END} {PGUP} {PGDN} {SPACE} {F1} … {F12}</code>
      </div>
      <div class="tokens">
        <span>Modifier combinations — CTRL, SHIFT, ALT, CMD, then a key or one character</span>
        <code>{CTRL+C} {CMD+SPACE} {CTRL+ALT+DEL} {CMD+SHIFT+4}</code>
      </div>
      <div class="tokens">
        <span>Media and browser</span>
        <code>{PLAYPAUSE} {PLAY} {PAUSE} {NEXTTRACK} {PREVTRACK} {STOP} {VOLUMEUP}
          {VOLUMEDOWN} {MUTE} {SEARCH} {CALC} {BROWSERHOME} {BROWSERBACK}
          {BROWSERFORWARD}</code>
      </div>
      <div class="tokens" style="margin-bottom:0">
        <span>Delay</span>
        <code>{WAIT:500}</code> — milliseconds, up to 60000
      </div>
    </section>

  </div>

  <div class="runbar" id="runbar">
    <div class="info">
      <div class="line"><span id="runName"></span><span class="dim" id="runCount"></span></div>
      <div class="line"><span id="runStep"></span></div>
      <div class="track"><div class="fill" id="runFill"></div></div>
    </div>
    <button class="danger" id="runStop">Stop</button>
  </div>
</template>

<template id="view-ui">
  <div class="wrap">

    <section>
      <h2>UI files</h2>
      <p class="note">The UI is one bundle: <code>index.html</code>,
        <code>style.css</code> and <code>app.js</code>, built by
        <code>pnpm build</code>. It is uploaded as <strong>one archive</strong>,
        never a file at a time — the shell and the script it loads can then never
        be one version apart. Uploading <strong>replaces the built-in copies
        until they are reset</strong>; changes take effect on the next page load,
        with no restart and no reflashing.</p>
      <p class="note">Build it with <code>pnpm build</code>, then upload
        <code>main/web/dist/web.zip</code>. An upload is written in one piece: if
        the transfer is interrupted, the previous UI keeps being served.</p>
      <div id="fileList"></div>
      <p class="note" id="fsNote"></p>
      <p class="note" id="uiNote"></p>
      <div class="row" style="margin-top:10px">
        <button id="uiArchiveUpload" class="primary">Upload web.zip…</button>
        <button id="uiArchiveReset">Reset to built-in</button>
        <button id="uiRefresh">Refresh list</button>
      </div>

      <!-- What the archive will do, before it does it. The device publishes an
           upload all at once or not at all, so this is the only moment the
           consequences can still be called off. -->
      <section id="uiReview" class="review" hidden>
        <h3 id="uiReviewTitle">Review</h3>
        <p class="note" id="uiReviewSummary"></p>
        <div id="uiReviewBody"></div>
        <div class="row" style="margin-top:12px">
          <button id="uiReviewGo" class="primary">Upload</button>
          <button id="uiReviewCancel">Cancel</button>
        </div>
        <progress id="uiProgress" max="100" value="0" hidden></progress>
        <p class="note" id="uiProgressNote"></p>
      </section>
    </section>

  </div>
</template>

<script type="module" src="app.js"></script>
</body>
</html>
