<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>ESP32 Remote</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- One shell for every view. The top bar and the status dot live here, so a
     view script always reports into the same elements; the views themselves
     are <template>s below and the router mounts exactly one at a time. -->
<div class="topbar">
  <span><span class="dot off" id="dot"></span><span id="statusText">connecting…</span></span>
  <nav class="nav">
    <a href="#/">Control</a>
    <a href="#/settings">Settings</a>
    <a href="#/macros">Macros</a>
    <a href="#/ui">UI files</a>
  </nav>
</div>

<!-- One access gate for the whole shell. It stays hidden until requireAuth
     finds no valid saved code; the markup lives here so it is parsed once. -->
<div id="gate" class="hidden">
  <div class="gate-box">
    <h1>ESP32 Remote</h1>
    <p>Enter the 12-character code shown on the device's LCD &mdash; or scan its QR.</p>
    <input id="tokenInput" type="text" inputmode="latin" autocomplete="off"
           autocapitalize="characters" spellcheck="false" maxlength="20"
           placeholder="XXXXXXXXXXXX">
    <button id="tokenGo" class="primary">Connect</button>
    <p class="err" id="gateErr"></p>
  </div>
</div>

<!-- The router clones one template here. Templates are inert, so their IDs do
     not exist until they are mounted - which is what keeps the four views'
     colliding IDs (dot, statusText, ...) out of each other's way. -->
<main id="view"></main>

<template id="view-control">
  <div id="pad">
    <div id="hint">
      One finger moves · two scroll · three drag<br>
      Tap to click · <span class="hint-help">?</span> button shows all gestures
    </div>
    <div id="escHint">Mouse captured — Esc releases it</div>
    <div class="flash" id="flash"></div>
    <!-- A captured pad has no text the user is looking at, so the whole
         surface changes when the link drops: red hatch and border, not just
         the status dot in the far corner. -->
    <div id="linkLost" role="alert">
      <span class="lost-mark" aria-hidden="true">!</span>
      <span class="lost-title">Connection lost</span>
      <span class="lost-sub" id="linkLostSub">Input is not reaching the host — reconnecting…</span>
      <span class="lost-sub">Esc releases the mouse.</span>
    </div>
    <!-- Low-key confirmation that the host is receiving input. Only visible
         while captured and connected. -->
    <div id="inputPulse" aria-hidden="true"></div>
    <button id="helpOpen" type="button" aria-label="Gesture help">?</button>
  </div>

  <!-- First-visit gesture help. Fixed above the pad, so dismissing it leaves
       the pad untouched; it is reopened by the ? button in the pad corner. -->
  <div id="help" class="help" hidden>
    <div class="help-sheet" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
      <h2 id="helpTitle">Gestures</h2>
      <ul class="help-list">
        <li>
          <span class="fingers" aria-hidden="true"><i></i></span>
          <span><strong>One finger</strong><small>Move the pointer · tap for a left click</small></span>
        </li>
        <li>
          <span class="fingers" aria-hidden="true"><i></i><i></i></span>
          <span><strong>Two fingers</strong><small>Scroll · tap for a right click</small></span>
        </li>
        <li>
          <span class="fingers" aria-hidden="true"><i></i><i></i><i></i></span>
          <span><strong>Three fingers</strong><small>Drag: press, move, release · tap for a middle click</small></span>
        </li>
        <li>
          <span class="keycap" aria-hidden="true">Ctrl</span>
          <span><strong>Chord</strong><small>Tap Ctrl, Alt or Cmd on the keyboard, then the next key</small></span>
        </li>
      </ul>
      <p class="help-note">On a computer, click the pad to capture the mouse and
        press Esc to release it. While captured, the small dot in the pad corner
        lights when input is going out.</p>
      <button id="helpClose" class="primary" type="button">Got it</button>
    </div>
  </div>

  <div class="panel" id="type">
    <h2>Type text into the host</h2>
    <textarea id="typeText" placeholder="Paste or type text here — it will be typed into the host as real keystrokes."
              spellcheck="false" autocapitalize="none" autocomplete="off"></textarea>
    <div class="row" style="margin:8px 0">
      <button id="typeGo" class="primary">Type it</button>
      <button id="typeStop" class="danger">Stop</button>
      <button id="typeClear">Clear</button>
    </div>
    <p class="note" id="typeNote">Assumes a US QWERTY host layout. Keep this tab in
      the foreground while typing &mdash; browsers throttle timers in background tabs.</p>
  </div>

  <!-- The keyboard slot. Two keyboards can fill it and only one can be showing,
       so the switch is the first thing in it rather than a setting buried in
       Setup: it describes the phone you are holding, not the device. The choice
       is remembered per browser. -->
  <div id="kbd">
    <div id="kbSource" role="tablist" aria-label="Keyboard source">
      <button type="button" role="tab" data-src="built">⌨ Built-in</button>
      <button type="button" role="tab" data-src="system">⌨ Your keyboard</button>
    </div>
    <div id="kbBuilt"></div>
    <div id="kbCapture" hidden>
      <textarea id="kbCaptureField" rows="2" spellcheck="false"
                autocorrect="off" autocapitalize="none" autocomplete="off"
                placeholder="tap here to type with your own keyboard"></textarea>
      <p class="note">Characters are translated to keystrokes; Escape, Tab, the
        arrows and F-keys come through as keys. Nothing is echoed here — watch
        the host.</p>
    </div>
  </div>

  <div class="panel" id="mediaPanel">
    <h2>Media &amp; browser keys</h2>
    <div id="media"></div>
    <p class="note" id="mediaNote">These are Consumer Control usages. Whether
      they do anything depends on the host — macOS and Windows handle the
      transport and volume keys; some Linux desktops need the keybound to an
      action first.</p>
  </div>

  <div id="controls">
    <button id="bLeft">L</button>
    <button id="bRight">R</button>
    <button id="bMid">M</button>
    <button id="bKbd">⌨ Keys</button>
    <button id="bMedia">🎵 Media</button>
    <button id="bType">📋 Type</button>
    <a id="bMacros" class="btn" href="#/macros">⚡ Macros</a>
    <button id="bRelease" class="danger">Release</button>
  </div>
</template>

<template id="view-settings">
  <div class="wrap">

    <section>
      <h2>Device</h2>
      <div class="field">
        <span>Product name — the device name the host shows <small>(USB string 2)</small></span>
        <input type="text" id="usbProduct" maxlength="31" spellcheck="false"
               autocomplete="off" placeholder="ESP32 Remote">
      </div>
      <div class="field">
        <span>Manufacturer <small>(USB string 1)</small></span>
        <input type="text" id="usbManufacturer" maxlength="31" spellcheck="false"
               autocomplete="off" placeholder="ESP32">
      </div>
      <div class="field">
        <span>Interface label <small>(USB string 4 — cosmetic)</small></span>
        <input type="text" id="usbInterface" maxlength="31" spellcheck="false"
               autocomplete="off" placeholder="Keyboard Mouse Media">
      </div>
      <p class="note">ASCII only, up to 31 characters — anything else is replaced
        with “?”. Both take effect after a restart, and the host must re-read the
        USB descriptors (replug the dongle).</p>
      <div class="row">
        <button id="restart">Restart device</button>
      </div>
    </section>

    <section>
      <h2>Screen</h2>
      <div class="field">
        <span>Custom text <small>(the third BOOT screen)</small></span>
        <textarea id="screenText" rows="4" maxlength="260" spellcheck="false"
                  placeholder="Line one&#10;line two"></textarea>
        <p class="note">Shown on the LCD as 10 lines of 26 characters, so one
          screen holds 260. Enter starts a new line; longer lines wrap at a
          space, and a word with no space in it is cut. Plain ASCII only — the
          font has 96 glyphs, so anything else shows as “?” (one per byte: an em
          dash is three). Anything past the tenth line is dropped and marked
          with “...”. Leave it empty and the screen stays out of the BOOT cycle.</p>
      </div>
      <div class="field">
        <span>Custom image <small>(the fourth BOOT screen)</small></span>
        <div class="row" style="margin-bottom:8px">
          <label><input type="radio" name="screenImageFormat" value="colour" checked> Colour</label>
          <label><input type="radio" name="screenImageFormat" value="grey"> Greyscale</label>
        </div>
        <div class="row" style="margin-bottom:8px">
          <button id="screenImagePick">Choose image…</button>
          <button id="screenImageSend" class="primary" disabled>Send to device</button>
          <button id="screenImageClear" hidden>Remove from device</button>
          <input type="file" id="screenImageFile" accept="image/*" hidden>
        </div>
        <canvas id="screenImagePreview" width="160" height="80"
                style="width:100%;max-width:320px;display:block;background:#000;
                       border:1px solid var(--line);border-radius:6px;
                       image-rendering:pixelated"></canvas>
        <p class="note" id="screenImageNote">checking the device…</p>
        <p class="note" id="screenImageHint">The preview above is the browser's
          rendering of the packed file — the dithered 160×80 copy the device will
          draw, not your original image. A colour image is packed as RGB565 at
          25,608 bytes; greyscale is 16 levels at 6,408, so a logo or a text card
          does not need four times the file. The panel is an uncalibrated TN run
          inverted, so colour will look muted and shift with the viewing angle;
          no gamma correction is attempted because the panel's response is
          unknown. An image of a different shape is scaled to fill the panel and
          cropped. With no image stored, this screen stays out of the BOOT cycle.</p>
      </div>
      <div class="field">
        <label>Sleep after <input type="range" id="screenTimeout" min="0" max="120" step="5">
          <span id="screenTimeoutVal"></span></label>
        <p class="note">Seconds without a button press before the display blanks.
          Set to 0 to leave it on. A tap of BOOT wakes it; a further tap cycles
          between the pairing QR, the status screen and the custom text.</p>
      </div>
    </section>

    <section>
      <h2>Touchpad</h2>
      <div class="field">
        <label>Pointer gain <input type="range" id="mouseGain" min="-200" max="90" step="1">
          <span id="mouseGainVal"></span></label>
        <span class="note">A high-DPI mouse reports raw counts while captured, and the OS
          pointer-speed curve does not apply — so a 3200 DPI gaming mouse needs
          roughly <code>0.02</code> here, where a basic mouse needs about
          <code>1</code>.</span>
      </div>
      <div class="field">
        <label>Scroll speed <input type="range" id="scrollScale" min="-70" max="90" step="1">
          <span id="scrollScaleVal"></span></label>
      </div>
      <div class="field">
        <label><input type="checkbox" id="scrollInvert"> Invert scroll direction</label>
      </div>
      <div class="field">
        <label><input type="checkbox" id="tapClick"> Tap to click</label>
      </div>
      <div class="field">
        <label>Tap timeout <input type="range" id="tapMaxMs" min="80" max="500" step="10">
          <span id="tapMaxMsVal"></span></label>
      </div>
      <p class="note">Gestures: one finger moves and taps to click · two fingers
        scroll and tap to right-click · three fingers drag (press, move, release).</p>
    </section>

    <section>
      <h2>Typing</h2>
      <div class="field">
        <label>Speed <input type="range" id="typeSpeed" min="2" max="60" step="1">
          <span id="typeSpeedVal"></span></label>
        <p class="note">Lower this if the target drops characters. Assumes a US
          QWERTY layout on the host.</p>
      </div>
    </section>

    <section>
      <h2>Network</h2>
      <div class="field">
        <span>Current</span>
        <div class="note" id="netState">unknown</div>
      </div>
      <div class="row">
        <button id="wifiScan">Scan networks</button>
        <button id="wifiForget" class="danger">Forget saved network</button>
      </div>
      <div class="list" id="wifiList"></div>
      <div class="field">
        <span>Join a network</span>
        <input type="text" id="wifiSsid" placeholder="Network name (SSID)"
               autocomplete="off" spellcheck="false" autocapitalize="none">
      </div>
      <div class="field">
        <span>Password</span>
        <input type="password" id="wifiPass" placeholder="Password" autocomplete="off">
      </div>
      <div class="row">
        <button id="wifiSave" class="primary">Save &amp; connect</button>
      </div>
      <p class="note">The device restarts and joins this network. If it can't, its
        own access point comes back so you can correct it. Holding BOOT for 3
        seconds also clears the saved network.</p>
    </section>

    <section>
      <h2>HID descriptor</h2>
      <p class="note">Exactly what the device reports to the operating system:
        the report descriptor it hands over at enumeration, plus the interface
        parameters from the configuration descriptor.</p>
      <div class="row" style="margin:10px 0">
        <button id="hidLoad">Show what the host sees</button>
      </div>
      <div class="note" id="hidSummary">not loaded</div>
      <pre id="hidDecoded" style="font-size:11px;line-height:1.45;color:#bbb;
           white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,monospace;margin-top:10px"></pre>
      <details style="margin-top:10px">
        <summary class="note" style="cursor:pointer">Raw descriptor bytes</summary>
        <pre id="hidRaw" style="font-size:11px;line-height:1.5;color:#999;white-space:pre-wrap;
             word-break:break-all;font-family:ui-monospace,SFMono-Regular,monospace"></pre>
      </details>
    </section>

    <section>
      <h2>Backup</h2>
      <p class="note">Everything you would otherwise have to re-enter: the device
        settings and the macros stored in <strong>this browser</strong>. It does
        not include your WiFi password, which lives in a separate store, so after
        a restore you may need to rejoin the network.</p>
      <div class="row" style="margin:10px 0">
        <button id="backupSave" class="primary">Download backup</button>
        <button id="backupLoad">Restore from file</button>
        <input type="file" id="backupFile" accept="application/json,.json" hidden>
      </div>
      <p class="note" id="backupNote"></p>
    </section>

    <section>
      <h2>Web UI files</h2>
      <p class="note">The pages are built into the firmware, but files uploaded to
        the device's filesystem are served instead. Open the UI files page to
        upload one or reset it to the built-in copy. This button deletes every
        uploaded file at once — the way back if an uploaded view script is broken.</p>
      <div class="row" style="margin:10px 0">
        <button id="uiOpen">Open UI files page</button>
        <button id="uiResetAll" class="danger">Reset UI to built-in</button>
      </div>
      <p class="note" id="uiNote"></p>
    </section>

    <section>
      <h2>Diagnostics</h2>
      <div class="row" style="margin-bottom:10px">
        <button id="logsLoad">Load logs</button>
        <button id="forgetCode">Forget saved code</button>
      </div>
      <div class="panel" id="logs" style="max-height:40dvh"><pre id="logText">—</pre></div>
    </section>

    <!-- Temporary instrument. It exists to answer one question: what does the
         browser actually deliver from the phone's own keyboard? That decides
         whether a system keyboard (Hacker's Keyboard, an IME, a Bluetooth
         board) can drive the device directly, or whether it has to be
         translated through a capture field first. Remove it once the answer is
         recorded in the design notes. -->
    <section>
      <h2>Key event probe</h2>
      <p class="note">Records exactly what the browser delivers from a keyboard
        &mdash; the phone&rsquo;s own keyboard, a Bluetooth board, or this
        computer. Tap the box below, then press keys on whichever keyboard you
        want to test.</p>
      <p class="note">Try each one, because they can take different paths:
        a letter, <strong>Shift</strong>+a letter, <strong>Ctrl</strong>+C,
        Tab, Esc, F5, the four arrows, Backspace with text in the box and
        without, Enter, and a chord your keyboard can make.</p>
      <textarea id="probeField" rows="2" spellcheck="false"
                autocorrect="off" autocapitalize="none" autocomplete="off"
                placeholder="tap here, then press keys"></textarea>
      <div class="row" style="margin:10px 0">
        <button id="probeClear">Clear</button>
        <button id="probeSelect">Select all</button>
      </div>
      <div class="note" id="probeStats">not listening</div>
      <pre id="probeLog"></pre>
      <p class="note">No copy button: this page is served over plain HTTP, where
        the clipboard API is unavailable. Select all, then copy from the
        selection menu.</p>
    </section>

    <div class="savebar">
      <button id="save" class="primary">Save now</button>
      <span class="note" id="saveNote" style="margin:0">changes save automatically</span>
    </div>

  </div>
</template>

<template id="view-macros">
  <div class="wrap wrap-macros">

    <section>
      <h2>Macros</h2>
      <p class="note">A macro is text typed into the host, with braced tokens for
        keys that are not characters: <code>{SEARCH}chrome{ENTER}</code> presses
        the Search media key, types “chrome” and presses Enter. Text assumes a US
        QWERTY layout on the host.</p>
      <p class="note">Macros are stored in <strong>this browser</strong>, not on
        the device. They are not shared with another phone or browser, and
        clearing this site's data removes them.</p>
      <div id="macroList"></div>
      <div class="row" style="margin-top:10px">
        <button id="macroAdd" class="primary">Add macro</button>
      </div>
      <p class="note" id="saveNote"></p>
      <p class="note" id="blobMeter"></p>
    </section>

    <section id="editor">
      <h2 id="editorTitle">New macro</h2>
      <div class="field">
        <span>Name</span>
        <input type="text" id="editName" maxlength="40" spellcheck="false"
               autocomplete="off" autocapitalize="none" placeholder="Open Chrome">
      </div>
      <div class="field">
        <span>Steps</span>
        <textarea id="editSteps" rows="3" spellcheck="false" autocapitalize="none"
                  autocomplete="off" placeholder="{SEARCH}chrome{ENTER}"></textarea>
      </div>
      <details>
        <summary class="note" style="cursor:pointer">Insert a token</summary>
        <div class="chips" id="chips"></div>
      </details>
      <div class="note" id="parsePreview" style="margin-top:10px"></div>
      <div class="row" style="margin-top:12px">
        <button id="editSave" class="primary">Save macro</button>
        <button id="editCancel">Cancel</button>
      </div>
    </section>

    <section>
      <h2>Grammar</h2>
      <p class="note">Anything outside braces is typed as literal text. A literal
        brace is written <code>{{</code> or <code>}}</code>. Tokens are not case
        sensitive.</p>
      <div class="tokens" style="margin-top:12px">
        <span>Keys</span>
        <code>{ENTER} {TAB} {ESC} {BKSP} {DEL} {INS} {UP} {DOWN} {LEFT} {RIGHT}
          {HOME} {END} {PGUP} {PGDN} {SPACE} {F1} … {F12}</code>
      </div>
      <div class="tokens">
        <span>Modifier combinations — CTRL, SHIFT, ALT, CMD, then a key or one character</span>
        <code>{CTRL+C} {CMD+SPACE} {CTRL+ALT+DEL} {CMD+SHIFT+4}</code>
      </div>
      <div class="tokens">
        <span>Media and browser</span>
        <code>{PLAYPAUSE} {PLAY} {PAUSE} {NEXTTRACK} {PREVTRACK} {STOP} {VOLUMEUP}
          {VOLUMEDOWN} {MUTE} {SEARCH} {CALC} {BROWSERHOME} {BROWSERBACK}
          {BROWSERFORWARD}</code>
      </div>
      <div class="tokens" style="margin-bottom:0">
        <span>Delay</span>
        <code>{WAIT:500}</code> — milliseconds, up to 60000
      </div>
    </section>

  </div>

  <div class="runbar" id="runbar">
    <div class="info">
      <div class="line"><span id="runName"></span><span class="dim" id="runCount"></span></div>
      <div class="line"><span id="runStep"></span></div>
      <div class="track"><div class="fill" id="runFill"></div></div>
    </div>
    <button class="danger" id="runStop">Stop</button>
  </div>
</template>

<template id="view-ui">
  <div class="wrap">

    <section>
      <h2>UI files</h2>
      <p class="note">Each file the device serves has a built-in copy in the
        firmware. Uploading one here <strong>replaces the built-in copy until it
        is reset</strong>; resetting deletes the uploaded file and the built-in
        copy is served again. Changes take effect on the next page load — no
        restart and no reflashing.</p>
      <p class="note">The four views are templates in <code>index.html</code>,
        mounted by <code>router.js</code>. An upload that breaks the shell takes
        every view with it, so keep a copy of a working <code>index.html</code>
        before replacing it. A broken view script is recovered here: the shell
        still loads and the other views keep working.</p>
      <div id="fileList"></div>
      <p class="note" id="fsNote"></p>
      <p class="note" id="uiNote"></p>
    </section>

    <section>
      <h2>How an update goes</h2>
      <p class="note">Edit the file on this phone or on a computer, then upload
        it here and reload. Nothing needs to be reflashed.</p>
      <p class="note">An upload is written in one piece: if the transfer is
        interrupted, the previous copy keeps being served, so a dropped
        connection cannot leave a half-written page behind.</p>
      <div class="row" style="margin-top:10px">
        <button id="uiRefresh">Refresh list</button>
      </div>
    </section>

  </div>
</template>

<script src="common.js"></script>
<script src="macro.js"></script>
<script src="pad.js"></script>
<script src="settings.js"></script>
<script src="macros.js"></script>
<script src="ui.js"></script>
<script src="router.js"></script>
</body>
</html>
